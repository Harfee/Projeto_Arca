<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Arca - Início</title>
  <link rel="icon" href="/img/logos/logo-arca.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/all.min.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/home_page/style.css">
</head>

<body data-page="home_page">
<header id="navbar"></header>

<main>
    <div class="carrossel-wrapper">
        <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
                 <!-- Intervalo (1000 = 1s , 2000 = 2s , 3000 - 3s, ... 5000 = 5s, ... 10000 = 10s, ...) -->
            
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 2"></button>
            </div>
            
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img class="d-block w-100 foto" src="/img/carrosel.png" alt="Colocar algo aq ainda">
                </div>

                <div class="carousel-item">
                    <img class="d-block w-100" src="/img/carrosel2.png" alt="Colocar algo aq ainda">
                </div>

                <div class="carousel-item">
                    <img class="d-block w-100" src="/img/logos/serra.png" alt="Colocar algo aq ainda">
                </div>

            </div>
            
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>




</main>

<footer id="footer"></footer>

<script src="/js/global.js"></script>
<script src="/js/home_page/script.js"></script>
<script src="/assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
